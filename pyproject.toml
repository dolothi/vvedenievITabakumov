[project]
name = "papochka"
version = "0.1.0"
description = "Школьный проект: чат с ИИ и мини-игры на Flask"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "anthropic>=0.72.0",
    "flask>=3.0.3",
    "mysql-connector-python>=9.0.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
papochka = "papochka:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
