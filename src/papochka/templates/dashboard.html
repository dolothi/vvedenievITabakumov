<!DOCTYPE html>
<html lang="ru">
<head>
  {% include '_head.html' %}
  <title>Личный кабинет</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <!-- Форматирование ответов ИИ: Markdown, защита от вредного HTML, подсветка кода -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body data-initial="{{ (user.username or '?')[0]|upper }}">
  <header class="topbar">
    <div class="left">
      <button class="icon-btn" id="sidebarToggle" title="Скрыть или показать чаты" aria-label="Скрыть или показать чаты">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/>
        </svg>
      </button>
    </div>
    <div class="right">
      <span class="credits">{{ user.balance }} кредитов</span>
      <a href="/games" class="btn btn-ghost">Игры</a>
      <a href="/logout" class="btn btn-ghost">Выйти</a>
    </div>
  </header>

  <div class="layout">
    <!-- История чатов -->
    <aside class="sidebar">
      <button class="side-btn" id="newChatBtn" title="Новый чат (Ctrl+K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8l-4 1 1-4z"/>
        </svg>
        Новый чат
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="chatSearch" type="search" placeholder="Поиск" autocomplete="off">
      </label>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <div class="chat-col">
      <main>
        <!-- Пустое состояние -->
        <div class="empty-state" id="emptyState">
          <h1 class="hero"><span>Привет<span class="comma">,</span></span><span>{{ user.username }}!</span></h1>
          <p>Спроси что угодно — я отвечу</p>
        </div>

        <!-- Список сообщений -->
        <div class="messages" id="messages"></div>

        <!-- Ввод -->
        <div class="input-area">
          <div class="attach-preview" id="attachPreview"></div>
          <div class="input-wrap">
            <!-- Человечек держится пальцами за верхний край поля (линия y=104 — край поля).
                 Выглядывает, пока поле активно; по клику получает щелбан. -->
            <svg class="peeker" id="peeker" viewBox="0 0 240 130" aria-hidden="true">
              <defs><clipPath id="peekerClip"><rect width="240" height="104"/></clipPath></defs>
              <g clip-path="url(#peekerClip)">
                <g class="peek">
                  <circle cx="120" cy="86" r="50" fill="#f9f5f2" stroke="#1a1a1a" stroke-width="4"/>
                  <path d="M116 37 C110 22 128 16 130 28 C131 35 122 37 121 31" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
                  <g class="eyes">
                    <g class="blink">
                      <ellipse cx="103" cy="78" rx="12" ry="17" fill="#1a1a1a"/>
                      <ellipse cx="137" cy="78" rx="12" ry="17" fill="#1a1a1a"/>
                      <path d="M104 64 q6 1 6 9 q-6 -1 -6 -9 Z M138 64 q6 1 6 9 q-6 -1 -6 -9 Z" fill="#f9f5f2"/>
                    </g>
                  </g>
                </g>
              </g>
              <g class="hand">
                <path d="M62 112 C58 100 66 94 72 100 C72 92 82 90 85 98 C87 91 97 91 98 100 C102 94 110 98 107 108 C105 116 96 118 88 116 C80 118 66 120 62 112 Z" fill="#f9f5f2" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M73 101 L74 110 M86 99 L86 110 M98 101 L97 109" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
              </g>
              <g class="hand right">
                <path d="M178 112 C182 100 174 94 168 100 C168 92 158 90 155 98 C153 91 143 91 142 100 C138 94 130 98 133 108 C135 116 144 118 152 116 C160 118 174 120 178 112 Z" fill="#f9f5f2" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M167 101 L166 110 M154 99 L154 110 M142 101 L143 109" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
              </g>
              <!-- Искорки при появлении и звёздочки от щелбана -->
              <g fill="#f9cc73">
                <path class="spark" d="M40 70 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/>
                <path class="spark s2" d="M196 52 l2.5 -7 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 Z"/>
                <path class="spark s3" d="M62 26 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/>
                <path class="spark s4" d="M206 92 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z"/>
                <path class="bonk" d="M150 30 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/>
                <path class="bonk b2" d="M176 44 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/>
              </g>
            </svg>
            <button class="icon-btn attach" id="attachBtn" title="Прикрепить картинку">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
            <textarea id="textarea" rows="1" placeholder="Напишите сообщение..."></textarea>
            <button class="send-btn" id="sendBtn" disabled title="Отправить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
              </svg>
            </button>
          </div>
          <label class="model-pick" title="Модель ИИ">
            <select id="modelSelect">
              {% for id, label in models %}<option value="{{ id }}">{{ label }}</option>{% endfor %}
            </select>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </label>
        </div>
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</body>
</html>
