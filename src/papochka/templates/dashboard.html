<!DOCTYPE html>
<html lang="ru">
<head>
  {% include '_head.html' %}
  <title>Личный кабинет</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body data-initial="{{ (user.username or '?')[0]|upper }}">
  <header>
    <div class="logo">Личный кабинет</div>
    <div class="right">
      <span class="balance-badge">{{ user.balance }} кредитов</span>
      <a href="/games" class="btn btn-ghost">Игры</a>
      <a href="/logout" class="btn btn-ghost">Выйти</a>
    </div>
  </header>

  <div class="layout">
    <!-- История чатов -->
    <aside class="sidebar">
      <button class="btn btn-ghost new-chat" id="newChatBtn">+ Новый чат</button>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <div class="chat-col">
      <main>
        <!-- Пустое состояние -->
        <div class="empty-state" id="emptyState">
          <div class="avatar">{{ (user.username or '?')[0]|upper }}</div>
          <h1>Привет, {{ user.username }}!</h1>
          <p>Задайте вопрос — я помогу.</p>
        </div>

        <!-- Список сообщений -->
        <div class="messages" id="messages"></div>

        <!-- Ввод -->
        <div class="input-area">
          <div class="input-wrap">
            <textarea id="textarea" rows="1" placeholder="Напишите сообщение..."></textarea>
            <button class="send-btn" id="sendBtn" disabled title="Отправить">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/>
                <polyline points="5 12 12 5 19 12"/>
              </svg>
            </button>
          </div>
          <div class="hint">Enter — отправить, Shift+Enter — новая строка</div>
        </div>
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
