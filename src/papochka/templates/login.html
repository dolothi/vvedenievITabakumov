<!DOCTYPE html>
<html lang="ru">
<head>
  {% include '_head.html' %}
  <title>Вход</title>
</head>
<body class="auth">
  <div class="page">
    <h1 class="hero"><span>Снова</span><span>привет!</span></h1>

    <form id="loginForm">
      <label for="email">Email</label>
      <input class="field" type="email" id="email" placeholder="example@mail.ru" required autocomplete="email">

      <label for="password">Пароль</label>
      <input class="field" type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="btn btn-accent">Войти</button>
      <div class="msg"></div>
    </form>

    <div class="link">Нет аккаунта? <a href="/">Зарегистрироваться</a></div>
  </div>

  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
