<!DOCTYPE html>
<html lang="ru">
<head>
  {% include '_head.html' %}
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>{{ title }}</title>
</head>
<body class="play">
  <header class="topbar">
    <div class="logo">{{ title }}</div>
    <div class="right">
      <button class="btn btn-ghost" id="muteBtn">Звук: вкл</button>
      <a href="/games" class="btn btn-ghost">Игры</a>
      <a href="/dashboard" class="btn">Чат</a>
    </div>
  </header>

  <main>
    <canvas id="{{ canvas }}" width="{{ size[0] }}" height="{{ size[1] }}"></canvas>
    <div class="hint">{{ hint }}</div>
  </main>

  <script src="{{ url_for('static', filename='game-common.js') }}"></script>
  <script src="{{ url_for('static', filename=script) }}"></script>
</body>
</html>
