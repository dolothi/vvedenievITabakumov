<!DOCTYPE html>
<html lang="ru">
<head>
  {% include '_head.html' %}
  <title>Регистрация</title>
</head>
<body class="auth">
  <div class="page">
    <h1 class="hero"><span>Ты тут</span><span>впервые?</span></h1>

    <form id="registerForm">
      <div class="row">
        <div><label for="fullname">Имя</label>
        <input class="field" type="text" id="fullname" placeholder="Иван" required autocomplete="given-name"></div>
        <div><label for="surname">Фамилия</label>
        <input class="field" type="text" id="surname" placeholder="Иванов" required autocomplete="family-name"></div>
      </div>

      <label for="email">Email</label>
      <input class="field" type="email" id="email" placeholder="example@mail.ru" required autocomplete="email">

      <div class="row">
        <div><label for="password">Пароль</label>
        <input class="field" type="password" id="password" placeholder="От 6 символов" required autocomplete="new-password"></div>
        <div><label for="confirm_password">Ещё раз</label>
        <input class="field" type="password" id="confirm_password" placeholder="Повторите" required autocomplete="new-password"></div>
      </div>

      <button type="submit" class="btn btn-accent">Создать аккаунт</button>
      <div class="msg"></div>
    </form>

    <div class="link">Уже есть аккаунт? <a href="/login">Войти</a></div>
  </div>

  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
